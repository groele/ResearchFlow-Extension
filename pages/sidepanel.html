<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResearchFlow Capture</title>
  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="../styles/sidepanel.css">
</head>
<body class="glass-panel">
  <div class="sidepanel-container core-sidepanel">
    <header class="workspace-header"><div class="logo-area"><div class="logo-orb" aria-hidden="true"></div><div><h2>ResearchFlow</h2><p>Capture · organize · retrieve</p></div></div><button id="btn-options" class="btn-secondary btn-icon" title="Open research workspace">↗</button></header>
    <div class="context-bar glass-card"><label for="side-project-select">Project context</label><select id="side-project-select"><option value="">Unassigned</option></select></div>
    <nav class="tab-nav glass-card" aria-label="Side panel navigation"><button class="tab-btn active" data-tab="tab-capture">Capture</button><button class="tab-btn" data-tab="tab-workspace">Workspace</button></nav>
    <main class="tab-content-container">
      <section id="tab-capture" class="tab-pane active">
        <div class="capture-actions"><button id="btn-scrape" class="btn-primary w-full">Capture current paper</button></div>
        <form id="capture-form" class="metadata-form glass-card core-form">
          <label>Title<input id="meta-title" name="title" required placeholder="Paper or research record title"></label>
          <label>DOI<input id="meta-doi" name="doi" placeholder="10.xxxx/xxxx"></label>
          <label>Source URL<input id="meta-source-url" name="sourceUrl" type="url" placeholder="https://..."></label>
          <label>Type<select id="meta-type" name="recordType"><option value="literature">Literature</option><option value="experiment">Experiment</option><option value="analysis">Analysis</option><option value="note">Note</option></select></label>
          <label>Summary<textarea id="meta-summary" name="summary" placeholder="What is useful or reproducible about this item?"></textarea></label>
          <label>Notes<textarea id="meta-content" name="content" placeholder="Your interpretation, limitation, or follow-up"></textarea></label>
          <label>Tags<input id="meta-tags" name="tags" placeholder="method, material, question"></label>
          <button class="btn-primary" type="submit">Save to library</button>
        </form>
      </section>
      <section id="tab-workspace" class="tab-pane">
        <div class="notes-workspace glass-card"><h3>Working notes</h3><textarea id="scratchpad" placeholder="Temporary thoughts are stored locally as you type."></textarea></div>
        <div class="tasks-workspace glass-card"><div class="tasks-header"><h3>Next actions</h3><button id="btn-add-task" class="btn-secondary btn-sm">Add task</button></div><div id="side-tasks-list" class="tasks-list"></div></div>
      </section>
    </main>
  </div>
  <div id="side-toast" class="core-toast-region" aria-live="polite"></div>
  <script src="../scripts/ui-utils.js"></script>
  <script src="../scripts/storage.js"></script>
  <script src="../scripts/core/research-core.js"></script>
  <script src="../scripts/sidepanel.js"></script>
</body>
</html>
